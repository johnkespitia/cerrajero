name: Deploy Backend via SSH

on:
  push:
    branches:
      - campo_verde_api
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy via rsync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, pdo, pdo_mysql, fileinfo, gd, zip

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: ./src
        run: |
          composer validate --no-check-publish
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts

      - name: Clean and regenerate package cache
        working-directory: ./src
        run: |
          rm -f bootstrap/cache/packages.php
          rm -f bootstrap/cache/services.php
          php artisan package:discover --ansi || true

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r src/app deploy/
          cp -r src/bootstrap deploy/
          cp -r src/config deploy/
          cp -r src/database deploy/
          cp -r src/public deploy/
          cp -r src/resources deploy/
          cp -r src/routes deploy/
          cp -r src/storage deploy/
          cp -r src/vendor deploy/
          cp src/artisan deploy/
          cp src/composer.json deploy/
          cp src/composer.lock deploy/
          cp src/server.php deploy/ 2>/dev/null || true

          mkdir -p deploy/storage/framework/cache
          mkdir -p deploy/storage/framework/sessions
          mkdir -p deploy/storage/framework/views
          mkdir -p deploy/storage/logs
          mkdir -p deploy/storage/app/public
          mkdir -p deploy/bootstrap/cache

          if [ -f "src/storage/app/public/logocv.png" ]; then
            cp src/storage/app/public/logocv.png deploy/storage/app/public/logocv.png || true
          fi

          if [ -f deploy/bootstrap/cache/packages.php ] && grep -q "facade/ignition" deploy/bootstrap/cache/packages.php; then
            rm -f deploy/bootstrap/cache/packages.php
          fi

          chmod -R 775 deploy/storage
          chmod -R 775 deploy/bootstrap/cache

      - name: Create .env.production from GitHub Secrets
        run: |
          cat > deploy/.env.production << EOF
          APP_NAME="${{ secrets.APP_NAME || 'CAMPO VERDE API' }}"
          APP_ENV=${{ secrets.APP_ENV || 'production' }}
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=${{ secrets.APP_DEBUG || 'false' }}
          APP_URL=${{ secrets.APP_URL }}

          LOG_CHANNEL=${{ secrets.LOG_CHANNEL || 'stack' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'error' }}

          DB_CONNECTION=${{ secrets.DB_CONNECTION || 'mysql' }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          BROADCAST_DRIVER=${{ secrets.BROADCAST_DRIVER || 'log' }}
          CACHE_DRIVER=${{ secrets.CACHE_DRIVER || 'file' }}
          FILESYSTEM_DRIVER=${{ secrets.FILESYSTEM_DRIVER || 'local' }}
          QUEUE_CONNECTION=${{ secrets.QUEUE_CONNECTION || 'sync' }}
          SESSION_DRIVER=${{ secrets.SESSION_DRIVER || 'file' }}
          SESSION_LIFETIME=${{ secrets.SESSION_LIFETIME || '120' }}

          MEMCACHED_HOST=${{ secrets.MEMCACHED_HOST || '127.0.0.1' }}

          REDIS_HOST=${{ secrets.REDIS_HOST || '127.0.0.1' }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD || 'null' }}
          REDIS_PORT=${{ secrets.REDIS_PORT || '6379' }}

          MAIL_MAILER=${{ secrets.MAIL_MAILER || 'smtp' }}
          MAIL_HOST=${{ secrets.MAIL_HOST || 'centrovacacionalcampoverde.com' }}
          MAIL_PORT=${{ secrets.MAIL_PORT || '465' }}
          MAIL_USERNAME="${{ secrets.MAIL_USERNAME || 'no-reply@centrovacacionalcampoverde.com' }}"
          MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
          MAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION || 'ssl' }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS || 'no-reply@centrovacacionalcampoverde.com' }}
          MAIL_FROM_NAME="${{ secrets.MAIL_FROM_NAME || 'Centro Vacacional Campo Verde' }}"
          RESERVATION_INTERNAL_EMAIL=${{ secrets.RESERVATION_INTERNAL_EMAIL || secrets.MAIL_FROM_ADDRESS || 'no-reply@centrovacacionalcampoverde.com' }}

          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET=${{ secrets.AWS_BUCKET }}
          AWS_USE_PATH_STYLE_ENDPOINT=${{ secrets.AWS_USE_PATH_STYLE_ENDPOINT || 'false' }}

          PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
          PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
          PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}
          PUSHER_APP_CLUSTER=${{ secrets.PUSHER_APP_CLUSTER || 'mt1' }}

          MIX_PUSHER_APP_KEY=${{ secrets.MIX_PUSHER_APP_KEY }}
          MIX_PUSHER_APP_CLUSTER=${{ secrets.MIX_PUSHER_APP_CLUSTER || 'mt1' }}

          DEPLOY_MIGRATE_TOKEN=${{ secrets.DEPLOY_MIGRATE_TOKEN }}
          PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL || 'https://centrovacacionalcampoverde.com' }}
          EOF

      - name: Create update-env.php script
        run: |
          cat > deploy/update-env.php << 'ENDPHP'
          <?php
          $envFile = __DIR__ . '/.env';
          $productionFile = __DIR__ . '/.env.production';

          if (!file_exists($productionFile)) {
              echo "Missing .env.production\n";
              exit(1);
          }

          if (!file_exists($envFile)) {
              copy($productionFile, $envFile);
              echo "Created .env from .env.production\n";
              exit(0);
          }

          $productionVars = [];
          $lines = file($productionFile, FILE_IGNORE_NEW_LINES | FILE_SKIP_EMPTY_LINES);
          foreach ($lines as $line) {
              $line = trim($line);
              if ($line === '' || str_starts_with($line, '#') || !str_contains($line, '=')) {
                  continue;
              }
              [$key, $value] = explode('=', $line, 2);
              $productionVars[trim($key)] = trim($value);
          }

          $envContent = file_get_contents($envFile);
          $updated = 0;
          $added = 0;

          foreach ($productionVars as $key => $value) {
              $pattern = '/^' . preg_quote($key, '/') . '=.*$/m';
              if (preg_match($pattern, $envContent)) {
                  $envContent = preg_replace($pattern, "$key=$value", $envContent);
                  $updated++;
              } else {
                  $envContent .= "\n$key=$value";
                  $added++;
              }
          }

          file_put_contents($envFile, $envContent);
          echo "Updated: $updated, added: $added\n";
          ENDPHP

      - name: Validate SSH settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_BACKEND_DIR: ${{ secrets.SSH_BACKEND_DIR }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_HOST" ]] || { echo "Missing secret SSH_HOST"; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "Missing secret SSH_USER"; exit 1; }
          [[ -n "$SSH_PRIVATE_KEY" ]] || { echo "Missing secret SSH_PRIVATE_KEY"; exit 1; }
          [[ -n "$SSH_BACKEND_DIR" ]] || { echo "Missing secret SSH_BACKEND_DIR"; exit 1; }

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_BACKEND_DIR: ${{ secrets.SSH_BACKEND_DIR }}
        run: |
          set -euo pipefail
          RSYNC_RSH="ssh -p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'tests/' \
            --exclude 'phpunit.xml' \
            --exclude '.phpunit.result.cache' \
            --exclude 'storage/logs/' \
            --exclude 'storage/framework/cache/' \
            --exclude 'storage/framework/sessions/' \
            --exclude 'storage/framework/views/' \
            -e "$RSYNC_RSH" \
            ./deploy/ "${SSH_USER}@${SSH_HOST}:${SSH_BACKEND_DIR}/"

      - name: Run remote maintenance
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_BACKEND_DIR: ${{ secrets.SSH_BACKEND_DIR }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd '${SSH_BACKEND_DIR}'
          php update-env.php
          php artisan migrate:production --force
          php artisan storage:link || true
          chmod -R 775 storage bootstrap/cache || true
          REMOTE
